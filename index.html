<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4f1" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The build pre-renders every public marketing route and replaces these
         defaults with route-specific values. They remain useful for the root
         document during local development and as a safe crawler fallback. -->
    <title>Zybble — Find the businesses that need you</title>
    <meta name="description" content="Zybble is an AI-powered lead generation platform that helps you find, enrich and reach your next customers. Start with 100 free leads each month." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Zybble, Inc." />
    <link rel="canonical" href="https://zybble.com/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zybble" />
    <meta property="og:title" content="Zybble — Find the businesses that need you" />
    <meta property="og:description" content="Find, enrich and reach your next customers with one simple AI-powered platform. Start with 100 free leads each month." />
    <meta property="og:url" content="https://zybble.com/" />
    <meta property="og:image" content="https://zybble.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zybble — AI-powered lead generation and outreach" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zybble — Find the businesses that need you" />
    <meta name="twitter:description" content="Find, enrich and reach your next customers with one simple AI-powered platform. Start with 100 free leads each month." />
    <meta name="twitter:image" content="https://zybble.com/og.png" />
    <meta name="twitter:image:alt" content="Zybble — AI-powered lead generation and outreach" />

    <!-- Supplied brand mark. SVG keeps the favicon crisp at every size. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are non-blocking after the first paint; system fallbacks preserve
         readable text if the third-party stylesheet is unavailable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" />

    <!-- Replaced with route-specific JSON-LD during the production build. -->
    <!-- STATIC_JSON_LD_START -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","@id":"https://zybble.com/#org","name":"Zybble","url":"https://zybble.com/","logo":"https://zybble.com/logo.svg"}</script>
    <!-- STATIC_JSON_LD_END -->
  </head>
  <body>
    <a class="sr-only" href="#main-content">Skip to main content</a>
    <div id="root">
      <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f4f1;color:#8b867e;font:500 14px -apple-system,sans-serif;letter-spacing:0.02em">
        <span style="display:flex;align-items:center;gap:10px">
          <span style="width:14px;height:14px;border:2px solid #d8d5d0;border-top-color:#14120f;border-radius:50%;animation:boot-spin 0.7s linear infinite"></span>
          Loading Zybble
        </span>
      </div>
      <style>
        @keyframes boot-spin { to { transform: rotate(360deg) } }
        @media (prefers-reduced-motion: reduce) { #boot span span { animation: none } }
      </style>
    </div>
    <noscript>
      <div style="padding:2rem;font:400 15px/1.6 system-ui,sans-serif">
        Zybble uses JavaScript for interactive features. You can still explore
        <a href="/features">features</a>, <a href="/pricing">pricing</a> and the
        <a href="/blog">blog</a>.
      </div>
    </noscript>
    <script>
      // Surface boot failures instead of leaving a blank page. This is kept
      // inline so it also works when the module bundle cannot be downloaded.
      window.addEventListener("error", function (e) {
        var boot = document.getElementById("boot");
        if (!boot || !boot.parentNode) return;
        var err = (e.error && (e.error.stack || e.error.message)) || e.message || "Unknown error";
        boot.innerHTML =
          '<div style="max-width:520px;padding:32px;text-align:center">' +
          '<div style="font-family:-apple-system,sans-serif;font-weight:600;font-size:20px;color:#14120f;letter-spacing:-0.02em">Something went wrong loading Zybble</div>' +
          '<p style="margin-top:10px;font:400 13px/1.6 -apple-system,sans-serif;color:#8b867e">Please hard-refresh (Ctrl/Cmd + Shift + R). If this keeps happening, contact hello@zybble.com.</p>' +
          '<pre style="margin-top:16px;max-width:100%;overflow:auto;text-align:left;font:400 11px/1.5 ui-monospace,monospace;color:#b8b4ae;background:#eeecea;border-radius:8px;padding:10px 12px"></pre>' +
          "</div>";
        boot.querySelector("pre").textContent = String(err).slice(0, 400);
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
