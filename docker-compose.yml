version: "3.9"

# Zybble production topology.
#   api       → Fastify server (auth, AI, campaigns, billing, webhooks)
#   mailer    → email delivery + sequence planner + subscription rollovers
#   scraper   → Python/Selenium Google Maps worker (separate, never serverless)

services:
  api:
    build: ./server
    command: node dist/server.js
    env_file: .env
    ports:
      - "8787:8787"
    restart: unless-stopped

  mailer:
    build: ./server
    command: node dist/worker.js
    env_file: .env
    restart: unless-stopped

  scraper:
    build: ./worker
    env_file: .env
    restart: unless-stopped
    shm_size: "2gb" # Chrome needs /dev/shm headroom
