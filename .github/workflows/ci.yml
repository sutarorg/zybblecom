name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Type-checks the frontend AND the serverless API in one pass.
      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate deployment config
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('vercel.json'));
            if (!c.crons?.some(j => j.path === '/api/cron/tick'))
              throw new Error('missing background cron');
            if (!c.rewrites?.some(r => r.source === '/api/:path*'))
              throw new Error('missing api rewrite');
            console.log('vercel.json OK');
          "
          node -e "
            const r = JSON.parse(require('fs').readFileSync('railway.json'));
            if (r.build?.builder !== 'DOCKERFILE' || r.build?.dockerfilePath !== 'worker/Dockerfile')
              throw new Error('railway.json must build worker/Dockerfile with the Dockerfile builder');
            console.log('railway.json OK');
          "

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate optional scraper provider
        run: python -m compileall -q worker

      - name: Assert no separate-service infrastructure remains
        run: |
          # railway.json is the scraper worker's deployment config (allowed).
          # The app itself must never grow a separate API/mailer service.
          for path in server render.yaml docker-compose.yml; do
            if [ -e "$path" ]; then
              echo "::error::$path should not exist in the single-app architecture"
              exit 1
            fi
          done
          echo "single-app layout OK"
