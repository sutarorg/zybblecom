# Optional one-click backend deploy on Render (alternative to Railway — README Step 5).
# Dashboard → New → Blueprint → connect this repo. Set the env var values when prompted.

services:
  - type: web
    name: zybble-api
    runtime: docker
    rootDir: server
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: o4-mini
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_ENCRYPTION_KEY
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: APP_URL
        sync: false # your Vercel domain, e.g. https://zybble.vercel.app

  - type: worker
    name: zybble-mailer
    runtime: docker
    rootDir: server
    dockerCommand: node dist/worker.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: o4-mini
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_ENCRYPTION_KEY
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: APP_URL
        sync: false

  - type: worker
    name: zybble-scraper
    runtime: docker
    rootDir: worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "5"
